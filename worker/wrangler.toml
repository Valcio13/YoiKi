name = "guess-draw-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[ d1_databases ]]
binding = "DB"
database_name = "guess-draw-db"
database_id = "local-db"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[ r2_buckets ]]
binding = "STORAGE"
bucket_name = "guess-draw-storage"

[vars]
ENVIRONMENT = "development"
