<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Klecks Draw</title>
  <meta name="color-scheme" content="dark light" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
    }
  </style>
</head>
<body>
<script src="./embed.js"></script>
<script>
  (function () {
    const urlParams = new URLSearchParams(window.location.search);
    const draftKey = urlParams.get('draftKey') || 'guess_draw_draft';

    const klecks = new Klecks({
      onSubmit: async (onSuccess, onError) => {
        try {
          const blob = await klecks.getPNG();
          // Send to parent
          window.parent.postMessage({
            type: 'klecks:submit',
            blob: blob,
          }, '*');
          if (onSuccess) onSuccess();
        } catch (err) {
          console.error('Submit error:', err);
          if (onError) onError();
        }
      }
    });

    window.klecksInstance = klecks;

    // Helper to find the active canvas
    function getCompositeCanvas() {
      // Find canvas inside klecks container
      const canvases = document.querySelectorAll('canvas');
      if (!canvases.length) return null;
      // In klecks, find either the main render canvas or create a composite
      for (let i = canvases.length - 1; i >= 0; i--) {
        if (canvases[i].width > 100 && canvases[i].height > 100) {
          return canvases[i];
        }
      }
      return canvases[0];
    }

    window.getCanvasSnapshot = async function () {
      try {
        const c = getCompositeCanvas();
        if (c) {
          // Ultra-low bandwidth preview: downscaled to 400x300 JPEG (approx 10-15KB)
          if (!window._previewCanvas) {
            window._previewCanvas = document.createElement('canvas');
            window._previewCanvas.width = 400;
            window._previewCanvas.height = 300;
          }
          const pCtx = window._previewCanvas.getContext('2d');
          pCtx.fillStyle = '#ffffff';
          pCtx.fillRect(0, 0, 400, 300);
          pCtx.drawImage(c, 0, 0, 400, 300);
          return window._previewCanvas.toDataURL('image/jpeg', 0.4);
        }
      } catch (e) {
        // Fallback
      }
      return null;
    };

    // Check for draft in localStorage
    const savedDraft = localStorage.getItem(draftKey);
    const canvasWidth = 800;
    const canvasHeight = 600;

    if (savedDraft) {
      try {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = canvasWidth;
          canvas.height = canvasHeight;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);
          ctx.drawImage(img, 0, 0, canvasWidth, canvasHeight);

          klecks.openProject({
            width: canvasWidth,
            height: canvasHeight,
            layers: [{
              name: 'Drawing',
              isVisible: true,
              opacity: 1,
              mixModeStr: 'source-over',
              image: canvas,
            }]
          });
        };
        img.onerror = () => initBlank();
        img.src = savedDraft;
      } catch (e) {
        initBlank();
      }
    } else {
      initBlank();
    }

    function initBlank() {
      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      klecks.openProject({
        width: canvasWidth,
        height: canvasHeight,
        layers: [{
          name: 'Background',
          isVisible: true,
          opacity: 1,
          mixModeStr: 'source-over',
          image: canvas,
        }]
      });
    }

    // Auto-save draft every 10 seconds
    setInterval(async () => {
      try {
        const blob = await klecks.getPNG();
        const reader = new FileReader();
        reader.onloadend = () => {
          try {
            localStorage.setItem(draftKey, reader.result);
          } catch (e) {
            // Storage quota exceeded
          }
        };
        reader.readAsDataURL(blob);
      } catch (e) {
        // Not ready yet
      }
    }, 10000);

    // Listen for parent messages
    window.addEventListener('message', async (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'klecks:request-snapshot') {
        const snap = await window.getCanvasSnapshot();
        window.parent.postMessage({
          type: 'klecks:snapshot-data',
          dataUrl: snap,
        }, '*');
      }

      if (data.type === 'klecks:request-submit') {
        try {
          const blob = await klecks.getPNG();
          window.parent.postMessage({
            type: 'klecks:submit',
            blob: blob,
          }, '*');
        } catch (err) {
          console.error(err);
        }
      }

      if (data.type === 'klecks:clear') {
        initBlank();
        localStorage.removeItem(draftKey);
      }
    });

  })();
</script>
</body>
</html>
